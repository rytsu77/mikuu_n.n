// ===================== PARTE 5: música tuya, karaoke, clima a elección, más objetos =====================
let WXman=false,WXdayO=null,KO=null,MA=null,AN=null,mp=0,mavg=0,lastB=0,mfreq=null,plantT=+ls('mikuPlant')||Date.now();
const WS=[[/(^| )(tormenta|trueno|relampago)s?( |$)/,95],[/(^| )(nieve|nieva|nevar)( |$)/,73],[/(^| )(lluvia|llueva|llover)( |$)/,63],[/(^| )(niebla|neblina)( |$)/,45],[/(^| )(nublado|nubes)( |$)/,3],[/(^| )(soleado|sol|despejado)( |$)/,0]];
function setWeather(c){WXman=true;WX={t:20,code:c,day:true,min:12,max:24,manual:1};rainSnd()}
document.querySelectorAll('#wxrow button').forEach(b=>b.onclick=()=>{user();const w=b.dataset.w;
 if(w==='real'){WXman=false;WXdayO=null;fetchWX();say('Clima real ♪',1500)}
 else if(w==='dn'){WXdayO=WXdayO===null?true:WXdayO===true?false:null;say(WXdayO===null?'Hora real ♪':WXdayO?'Día ☀️':'Noche 🌙',1500)}
 else{setWeather(+w);say('Clima: '+WD(+w)+' ♪',1500)}});
// Baile con TU música: arrastra un archivo de audio a la página o usa el botón 🎶
function playMusic(f){if(!ac||!started){say('Primero entra a la página ♪');return}stopMusic();if(ac.resume)ac.resume();
 const a=new Audio(URL.createObjectURL(f)),sr=ac.createMediaElementSource(a);MA=a;AN=ac.createAnalyser();AN.fftSize=256;mfreq=new Uint8Array(AN.frequencyBinCount);
 sr.connect(AN);AN.connect(ac.destination);a.onended=stopMusic;a.play().catch(()=>{});$('#lights').style.display='block';
 setMode('dance',1e9);say('¡Qué buena canción, {n}! ♪ '+f.name.slice(0,20),4000)}
function stopMusic(){if(MA){MA.pause();MA=null}AN=null;mp=0;$('#lights').style.display='none';if(mode==='dance')setMode('idle',0)}
function pickMusic(){if(MA)stopMusic();else $('#mfile').click()}
$('#mfile').onchange=e=>{const f=e.target.files[0];if(f)playMusic(f);e.target.value=''};
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('audio'))playMusic(f)});
setInterval(()=>{if(!AN)return;AN.getByteFrequencyData(mfreq);let e=0;for(let i=1;i<7;i++)e+=mfreq[i];e/=6*255;mavg=mavg*.95+e*.05;
 if(e>mavg*1.25&&e>.35&&Date.now()-lastB>230){lastB=Date.now();mp=1}mp=Math.max(0,mp-.12);
 $('#lights').style.opacity=.2+mp*.6+e*.2;if(MA)MA.muted=muted;if(mode==='idle')setMode('dance',1e9);user()},50);
// Karaoke: canta lo que escribas ("canta hola mundo" en el chat, o el botón 🎤)
function singText(txt){if(!ac||muted){say('Activa el sonido 🔊 para que pueda cantar ♪');return}
 const ws=txt.split(/\s+/).slice(0,16),SC=[523,587,659,784,880,988,1047,1175];let at=0,idx=3;if(inroom)tvc=4;KO={ws,i:-1};
 ws.forEach((w,wi)=>{const vs=NZ(w).match(/[aeiou]/g)||['a'];setTimeout(()=>{KO.i=wi;if(!inroom)say(w,900)},at*1000);
  vs.forEach((v,vi)=>{idx=Math.max(0,Math.min(7,idx+pick([1,1,-1,2,-2,0])));const f=SC[idx],d=vi===vs.length-1?.35:.22;
   setTimeout(()=>{tone(f,v,d,0,1);setMode('sing',.4)},at*1000);at+=d*1.05});at+=.12});
 setTimeout(()=>{KO=null;if(mode==='sing')setMode('idle',0)},at*1000+600)}
function askSing(){const t=prompt('¿Qué quieres que cante Miku? Escribe una frase');if(t&&t.trim())singText(t.trim())}
// Más cosas en la casa: planta que hay que regar, peluche y micrófono
function plantUpd(){const h=(Date.now()-plantT)/36e5;$('#plant').textContent=h>72?'🥀':'🪴';$('#plant').style.opacity=h>24&&h<=72?.8:1}
$('#plant').onclick=()=>{user();const r=$('#plant').getBoundingClientRect();goTo(r.left+r.width/2,()=>{const w=(Date.now()-plantT)/36e5>72;
 plantT=Date.now();ls('mikuPlant',plantT);plantUpd();unlock('jardinera');gain(3,2);act('hop');say(w?'¡Se salvó mi plantita! Gracias, {n} ♥':'¡Glug glug! Planta feliz ♪');cari=Math.min(100,cari+(w?5:2));saveAll();mood()})};
$('#bear').onclick=()=>{user();const r=$('#bear').getBoundingClientRect();goTo(r.left+r.width/2,()=>{const c=cv.getBoundingClientRect();hearts(c.left+c.width/2,c.top+c.height*.3);
 act('hop');say('*abraza a su peluche* ♥');cari=Math.min(100,cari+3);saveAll();mood()})};
$('#mic').onclick=()=>{user();const r=$('#mic').getBoundingClientRect();goTo(r.left+r.width/2,()=>{say('¡Hora del karaoke! ♪',1500);askSing()})};
plantUpd();setInterval(plantUpd,60000);
// ===================== PARTE 6: modismos, progreso, diario, logros, cumpleaños =====================
var PG={pts:0,xp:0,streak:0,best:0,last:'',mins:0,ach:{},diary:[],bday:null,noB:0,cel:0};
try{Object.assign(PG,JSON.parse(ls('mikuPG')||'{}'))}catch(e){}
let LEARN={},DIA=ls('mikuDia')||'',LU=null,awaitB=false,bdayMode=false;const sessT=Date.now();
try{LEARN=JSON.parse(ls('mikuLearn')||'{}')}catch(e){}
const save6=()=>ls('mikuPG',JSON.stringify(PG));
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const pad2=n=>String(n).padStart(2,'0'),dstr=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()),today=()=>dstr(new Date());
// --- Modismos: argentino (vos), chileno (vo, cachai...), mexicano; se traducen a español neutro antes de entender
const DIALM={tenes:'tienes',queres:'quieres',podes:'puedes',sos:'eres',vos:'tu',decime:'dime',contame:'cuentame',veni:'ven',che:'',boludo:'',boluda:'',barbaro:'genial',copado:'genial',re:'muy',posta:'de verdad',laburo:'trabajo',plata:'dinero',pibe:'chico',
 cachai:'entiendes',po:'',weon:'',wn:'',huevon:'',bacan:'genial',fome:'aburrido','al tiro':'ahora',carrete:'fiesta','la raja':'genial',vo:'tu',tai:'estas',estai:'estas',queri:'quieres',teni:'tienes',sabi:'sabes',
 orale:'ok',ahorita:'ahora',chido:'genial',chamba:'trabajo',neta:'de verdad',wey:'',guey:'','no manches':'no puede ser',lana:'dinero'};
const DK=Object.keys(DIALM).map(k=>[new RegExp('(?<= |^)'+k+'(?= |$)','g'),DIALM[k]]);
function dial(n){const T=(l)=>new RegExp('(^| )('+l+')( |$)');
 if(T('vos|tenes|queres|podes|sos|decime|contame|veni|che|boludo|boluda|copado|barbaro|laburo|pibe').test(n))DIA='ar';
 else if(T('cachai|po|weon|wn|huevon|bacan|fome|tai|estai|queri|teni|sabi|vo|al tiro|carrete').test(n))DIA='cl';
 else if(T('orale|ahorita|chido|chamba|neta|wey|guey|no manches').test(n))DIA='mx';
 ls('mikuDia',DIA);for(const[r,v]of DK)n=n.replace(r,v);
 for(const k in LEARN)n=n.replace(new RegExp('(?<= |^)'+k+'(?= |$)','g'),LEARN[k]);return n.replace(/\s+/g,' ').trim()}
const ARW=[['tú','vos'],['eres','sos'],['tienes','tenés'],['quieres','querés'],['puedes','podés'],['dime','decime'],['cuéntame','contame'],['escríbeme','escribime'],['pídeme','pedime'],['prueba','probá'],['mira','mirá']]
 .map(([a,b])=>[new RegExp('(?<![\\wáéíóúñ])'+a+'(?![\\wáéíóúñ])','gi'),b]);
function dlect(t){if(DIA==='ar'){for(const[r,b]of ARW)t=t.replace(r,x=>x[0]===x[0].toUpperCase()?cap(b):b);if(Math.random()<.2)t+=' ¿Viste?'}
 else if(DIA==='cl'){if(Math.random()<.3)t+=' ¿Cachai?'}else if(DIA==='mx'&&Math.random()<.25)t='¡Órale! '+t;return t}
// --- Puntos, niveles, logros, recuerdos
const need=L=>20*(L-1)*(L-1),level=()=>{let L=1;while(PG.xp>=need(L+1))L++;return L};
function memo(t){PG.diary.push({d:today(),t});if(PG.diary.length>80)PG.diary.shift();save6()}
function gain(xp,pts){const L0=level();PG.xp+=xp;PG.pts+=pts;const L=level();
 if(L>L0){PG.pts+=15;memo('¡Subimos al nivel '+L+'!');setTimeout(()=>{say('¡Nivel '+L+', {n}! ♪ (+15 🪙)',4500);act('hop')},600);if(L>=5)unlock('nivel5');if(L>=10)unlock('nivel10')}save6();mood()}
const ACH=[['primera','Primera visita','Entraste por primera vez'],['racha3','Constante','3 días seguidos'],['racha7','Semana juntos','7 días seguidos'],['racha30','Inseparables','30 días seguidos'],['nivel5','Nivel 5','Llega al nivel 5'],['nivel10','Nivel 10','Llega al nivel 10'],['ritmo','Ritmo','Termina el minijuego'],['cantante','Dúo','Hazla cantar tu frase'],['dj','DJ','Hazla bailar con tu música'],['jardinera','Jardinera','Riega la planta'],['profe','Profesor/a','Enséñale una palabra'],['cumple','Pastelito','Cuéntale tu cumpleaños'],['noct','Noctámbulo/a','Habla con ella de madrugada'],['horas','Una hora juntos','60 minutos con Miku'],['clima','Controlador del clima','Cambia el clima'],['secreto','Secreto','Encuentra un huevo de Pascua']];
function unlock(id){if(PG.ach[id])return;const a=ACH.find(x=>x[0]===id);if(!a)return;PG.ach[id]=today();PG.pts+=10;memo('🏆 Logro: '+a[1]);save6();
 setTimeout(()=>{say('🏆 Logro: '+a[1]+' (+10 🪙)',4000);vc([[880,'i',.1],[1175,'i',.1],[1397,'i',.25]])},300)}
function daily(){const t=today();if(PG.last===t)return;const ys=dstr(new Date(Date.now()-864e5));
 PG.streak=PG.last===ys?PG.streak+1:1;PG.best=Math.max(PG.best,PG.streak);PG.last=t;const b=Math.min(PG.streak,7);
 gain(10+b*2,10+b);unlock('primera');if(PG.streak>=3)unlock('racha3');if(PG.streak>=7)unlock('racha7');if(PG.streak>=30)unlock('racha30');
 if(PG.streak>1)memo('Llevamos '+PG.streak+' días seguidos juntos 🔥');
 setTimeout(()=>say(PG.streak>1?'¡Racha de '+PG.streak+' días, {n}! 🔥 (+'+(10+b)+' 🪙)':'¡Puntos diarios! (+10 🪙) ♪',4500),5200)}
setInterval(()=>{if(started&&!document.hidden){PG.mins++;if(PG.mins>=60)unlock('horas');save6()}},60000);
// Ganan puntos las acciones que ya existían
const _ask=ask;ask=function(r){gain(2,1);if(new Date().getHours()<5)unlock('noct');if(NZ(r)==='39')unlock('secreto');return _ask(r)};
const _gi=giveItem;giveItem=function(i){gain(5,3);return _gi(i)};
const _fin=finish;finish=function(){gain(10,8+Math.floor(RG.score/100));unlock('ritmo');return _fin()};
const _sg=singText;singText=function(t){unlock('cantante');gain(3,2);return _sg(t)};
const _pm=playMusic;playMusic=function(f){unlock('dj');gain(4,2);return _pm(f)};
const _sw=setWeather;setWeather=function(c){unlock('clima');return _sw(c)};
const _w=welcome;welcome=function(){const r=_w();daily();setTimeout(checkBday,9000);return r};
// Huevo de Pascua: código Konami
let kb=[];addEventListener('keydown',e=>{kb=[...kb,e.key.toLowerCase()].slice(-10);
 if(kb.join()==='arrowup,arrowup,arrowdown,arrowdown,arrowleft,arrowright,arrowleft,arrowright,b,a'){unlock('secreto');confetti(50);act('dance');say('¡Código secreto! ♪')}});
// --- Cumpleaños
function parseDate(q){let m=q.match(/(\d{1,2}) de ([a-z]+)/);
 if(m){const i=MES.indexOf(m[2].replace('setiembre','septiembre'));if(i>=0&&+m[1]>=1&&+m[1]<=31)return{d:+m[1],m:i+1}}
 if(awaitB){m=q.match(/^(\d{1,2}) (\d{1,2})( \d{2,4})?$/);if(m&&+m[1]>=1&&+m[1]<=31&&+m[2]>=1&&+m[2]<=12)return{d:+m[1],m:+m[2]}}return null}
function setBday(b){PG.bday=b;PG.noB=0;save6();unlock('cumple');memo('Me contaste que tu cumpleaños es el '+b.d+' de '+MES[b.m-1]);gain(10,10);checkBday()}
function confetti(n){for(let i=0;i<n;i++){const f=document.createElement('div');
 f.style.cssText=`position:fixed;top:-10px;left:${Math.random()*100}vw;width:7px;height:7px;background:hsl(${Math.random()*360},90%,60%);z-index:6;pointer-events:none;animation:fall linear forwards;animation-duration:${3+Math.random()*3}s`;
 document.body.appendChild(f);setTimeout(()=>f.remove(),6500)}}
function checkBday(){const b=PG.bday;if(!b||!started)return;const n=new Date(),y=n.getFullYear(),diff=Math.round((new Date(y,b.m-1,b.d)-new Date(y,n.getMonth(),n.getDate()))/864e5);
 if(diff===0)bdayMode=true;
 if(diff<=0&&diff>=-3&&PG.cel!==y){PG.cel=y;save6();bdayMode=true;$('#cake').style.display='block';confetti(60);
  setTimeout(()=>{say((diff<0?'¡Feliz cumpleaños atrasado':'¡Feliz cumpleaños')+', {n}! 🎂',6000);singText('Feliz cumpleaños '+(name||'a ti'))},800);gain(30,50);memo('Celebramos tu cumpleaños 🎂')}
 else if(diff>0&&diff<=7&&PG.cdDay!==today()){PG.cdDay=today();save6();say('¡Faltan '+diff+' días para tu cumpleaños, {n}! 🎂',5000)}}
$('#cake').onclick=()=>{user();$('#cake').textContent='🍰';confetti(40);act('hop');say('¡Soplaste las velas! Pide un deseo, {n} ✨',5000);setTimeout(()=>{$('#cake').style.display='none';$('#cake').textContent='🎂'},6000)};
setInterval(()=>{if(started&&!PG.bday&&!PG.noB&&!awaitB&&visits>=2&&Date.now()-sessT>90000&&PG.askD!==today()&&mode!=='sleep'){
 PG.askD=today();save6();awaitB=true;setTimeout(()=>awaitB=false,18e4);say('¿Cuándo es tu cumpleaños, {n}? Quiero acordarme 🎂 (escríbeme algo como "3 de mayo")',7000)}},20000);
// --- Diario y exportar progreso
function openDiary(){const L=level(),a=need(L),b=need(L+1),pct=Math.min(100,(PG.xp-a)/(b-a)*100);
 const mm=Object.entries(mem).filter(([k])=>k!=='gusta').map(([k,v])=>k+': '+v);if(mem.gusta)mm.push('te gusta: '+mem.gusta.join(', '));if(PG.bday)mm.push('cumpleaños: '+PG.bday.d+' de '+MES[PG.bday.m-1]);
 $('#diary').innerHTML=`<button id="dx" style="float:right">✕</button><h3>📖 DIARIO DE MIKU Y ${esc(name||'TÚ')}</h3><div>Nivel ${L} · ${PG.xp} XP</div><div class="bar"><i style="width:${pct}%"></i></div>
 <div>🪙 ${PG.pts} puntos · 🔥 racha ${PG.streak} (récord ${PG.best}) · ⏱️ ${PG.mins} min juntos · 🧠 ${Object.keys(LEARN).length} palabras que me enseñaste</div>
 <h3>🏆 LOGROS (${Object.keys(PG.ach).length}/${ACH.length})</h3>${ACH.map(([i,n,d])=>`<span class="ach ${PG.ach[i]?'':'lock'}" title="${esc(d)}">${PG.ach[i]?'🏆':'🔒'} ${esc(n)}</span>`).join('')}
 <h3>💭 LO QUE SÉ DE TI</h3><div>${mm.length?mm.map(esc).join(' · '):'Aún nada... ¡cuéntame!'}</div>
 <h3>📓 RECUERDOS</h3>${PG.diary.slice(-25).reverse().map(e=>'<div>'+e.d+' · '+esc(e.t)+'</div>').join('')||'<div>Aún no hay recuerdos.</div>'}
 <h3>💾 TU PROGRESO</h3><button id="dex">Exportar código</button> <button id="dim">Importar código</button>
 <div>Tu progreso vive solo en este navegador. Exporta tu código para llevarlo a otro dispositivo.</div>`;
 $('#diary').style.display='block';$('#dx').onclick=()=>$('#diary').style.display='none';$('#dex').onclick=exportP;$('#dim').onclick=importP}
function exportP(){const o={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('miku'))o[k]=localStorage.getItem(k)}}catch(e){}
 const code=btoa(unescape(encodeURIComponent(JSON.stringify(o))));try{navigator.clipboard.writeText(code).then(()=>say('¡Código copiado! Guárdalo bien ♪',3000))}catch(e){}prompt('Tu código de progreso (cópialo):',code)}
function importP(){const c=prompt('Pega tu código de progreso:');if(!c)return;
 try{const o=JSON.parse(decodeURIComponent(escape(atob(c.trim()))));Object.keys(o).forEach(k=>{if(k.startsWith('miku'))ls(k,String(o[k]))});say('¡Progreso importado! Recargando...',2000);setTimeout(()=>location.reload(),1200)}catch(e){say('Ese código no parece válido :(',3000)}}
mood();
</script></body></html>
